<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="th-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="th-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="th-bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="th-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="th-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E1B4B" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#th-bg)" />
  <!-- Inner Highlight Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#th-highlight)" stroke-width="1.5" />
  
  <!-- Brand Icon: Stylized Lightning Checkmark -->
  <g filter="url(#th-shadow)">
    <!-- Primary Bolt Mark -->
    <path d="M35 11L18 33.5H31L26.5 53L46 27H33L38 11H35Z" fill="url(#th-bolt)" />
    <!-- Secondary Dynamic Task Accent / Spark -->
    <circle cx="47" cy="46" r="3.5" fill="url(#th-check)" />
  </g>
</svg>